# Dependencies allowed to run install/build scripts. Lives here (not in
# package.json's "pnpm" field) because pnpm 10+ no longer reads that field.
#
# Two keys on purpose — different pnpm majors read different ones:
#   - allowBuilds (map): pnpm 11+ (GitHub Actions uses pnpm `latest`)
#   - onlyBuiltDependencies (list): pnpm 10 (Vercel's builder)
# Unknown keys are ignored by the other major, so both can coexist.
allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - msw
  - sharp
  - unrs-resolver
